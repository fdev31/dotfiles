"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"
format = "[$character$directory](bg:white)$jobs[ ](fg:white)"
right_format = """
[](fg:black)$git_branch$git_status[](fg:black bg:surface1)[$lua$nodejs$rust$golang$python$c$cmake](bg:black)[](fg:surface1 bg:surface2)[$all](bg:surface2)[$status$time](fg:subtext0 bg:surface2)[](fg:surface2)
"""
continuation_prompt = "[∙](bright-black) "
scan_timeout = 30
command_timeout = 500
follow_symlinks = true

