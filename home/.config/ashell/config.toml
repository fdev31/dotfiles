[outputs]
Targets = [
    "eDP-1",
]

[modules]
left = [
    [
        "Updates",
        "SystemInfo",
    ],
    "WindowTitle",
]
center = [
    "Workspaces",
]
right = [
    [
        "Tray",
        "Settings",
    ],
    [
        "Tempo",
        "CustomNotifications",
    ],
]

[updates]
check_cmd = "checkupdates; yay -Qua"
update_cmd = "kitty --hold yay -Syu"

[window_title]
mode = "Title"
truncate_title_after_length = 75

[appearance]
primary_color = "#99cdff"
background_color = "#16191c"
success_color = "#ceb6e1"
text_color = "#99cdff"
workspace_colors = [
    "#99cdff",
    "#efa8bc",
    "#ceb6e1",
    "#8a8bf1",
    "#e5c890",
    "#a6d189",
    "#e78284",
]
opacity = 1.0

[appearance.menu]
opacity = 0.8

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

[appearance.secondary_color]
base = "#28333d"

[settings]
lock_cmd = "hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"
remove_airplane_btn = true

[tempo]
weather_location="Current"

[workspaces]
enable_workspace_filling = false
max_workspaces = 10
disable_special_workspaces = true
visibility_mode = "MonitorSpecific"
workspace_names = [
    "",
    "󰇧",
    "󰅩",
    "燎",
    "󰟞",
    "",
    "更",
    "󰭹",
    "亮",
    "👽",
    "",
]

[[CustomModule]]
name = "CustomNotifications"
icon = ""
command = "swaync-client -t -sw"
listen_cmd = "swaync-client -swb"
alert = ".*notification"

[CustomModule.icons]
"dnd.*" = ""

